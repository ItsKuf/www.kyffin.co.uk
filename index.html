<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kyffin.co.uk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Instrument Serif", Georgia, serif;
        background: #0e0d0c;
        color: #c9c4bb;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        z-index: 2;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
      }

      /* Soft vignette + faint warm haze */
      .stage::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 45%,
            rgba(45, 38, 32, 0.35) 0%,
            transparent 55%
          ),
          radial-gradient(circle at 50% 50%, transparent 35%, #070605 100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Lazy analogue drift */
      .wash {
        position: fixed;
        z-index: 0;
        inset: -20%;
        background: conic-gradient(
          from 120deg at 50% 50%,
          rgba(120, 90, 60, 0.08),
          rgba(40, 55, 70, 0.06),
          rgba(90, 70, 50, 0.07),
          rgba(120, 90, 60, 0.08)
        );
        filter: blur(80px);
        animation: wash 28s ease-in-out infinite alternate;
        pointer-events: none;
      }

      @keyframes wash {
        0% {
          transform: translate(-4%, 2%) rotate(0deg) scale(1.05);
          opacity: 0.85;
        }
        100% {
          transform: translate(3%, -3%) rotate(12deg) scale(1.12);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wash {
          animation: none;
        }
      }

      .domain {
        position: relative;
        text-align: center;
        padding: 2rem;
      }

      .domain h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.4rem, 8vw, 5.5rem);
        letter-spacing: 0.02em;
        line-height: 1.05;
        color: #ded8cf;
        text-shadow:
          0 0 60px rgba(200, 180, 150, 0.12),
          0 1px 0 rgba(0, 0, 0, 0.5);
        opacity: 0.92;
      }

      .domain .tld {
        font-style: italic;
        color: #a39a8d;
      }

      /* Film grain: below .stage so type stays clean */
      #grain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.28;
        mix-blend-mode: overlay;
      }

      /* Subtle scan shimmer — very low key */
      .scan {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.03) 2px,
          rgba(0, 0, 0, 0.03) 3px
        );
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="wash" aria-hidden="true"></div>
    <div class="stage">
      <main class="domain">
        <h1>
          kyffin<span class="tld">.co.uk</span>
        </h1>
      </main>
    </div>
    <canvas id="grain" aria-hidden="true"></canvas>
    <div class="scan" aria-hidden="true"></div>
    <script>
      (function () {
        const canvas = document.getElementById("grain");
        const ctx = canvas.getContext("2d", { alpha: true });
        const off = document.createElement("canvas");
        const offCtx = off.getContext("2d", { alpha: true });
        /** Render grain at low res and scale up: chunky analogue noise, cheap per frame. */
        const GRAIN_SCALE = 3;

        let bufW = 0;
        let bufH = 0;
        let imageData;

        function resize() {
          bufW = Math.max(1, Math.ceil(window.innerWidth / GRAIN_SCALE));
          bufH = Math.max(1, Math.ceil(window.innerHeight / GRAIN_SCALE));
          off.width = bufW;
          off.height = bufH;
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          imageData = offCtx.createImageData(bufW, bufH);
          ctx.imageSmoothingEnabled = true;
        }

        resize();
        window.addEventListener("resize", resize);

        function tick() {
          const d = imageData.data;
          const len = d.length;
          for (let i = 0; i < len; i += 4) {
            const n = (Math.random() * 256) | 0;
            d[i] = n;
            d[i + 1] = n;
            d[i + 2] = n;
            d[i + 3] = 18 + ((Math.random() * 50) | 0);
          }
          offCtx.putImageData(imageData, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
